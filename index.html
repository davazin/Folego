<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fôlego">
<meta name="theme-color" content="#060706">
<title>Fôlego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  /* layout: app escuro de uma coluna — topo com a marca, conteúdo rolável, barra de navegação fixa no rodapé.
     Marca Fôlego: preto profundo com amarelo esverdeado (#CCFF00) como única cor de destaque. */
  --bg:#060706; --surface:#0f110f; --soft:#171a17; --ink:#eff4ed; --muted:#8a9488; --line:#232823;
  --accent:#ccff00; --accent-ink:#0b0d00; --accent-dim:#222b04; --bad:#ff5d52; --warn:#f2b53a;
  --display:"Unbounded","Arial Black",sans-serif;
  --body:"Manrope",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.com-controles{padding-bottom:calc(156px + env(safe-area-inset-bottom))}
body[data-tela="sessao"]{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
body[data-tela="editor"],body[data-tela="perfil"],body[data-tela="foto"],body[data-tela="dia"],body[data-tela="outra"]{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 65%,transparent);outline-offset:2px}
button{font-family:var(--body)}
::selection{background:var(--accent);color:var(--accent-ink)}

/* ---------- topo ---------- */
#topo{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;max-width:672px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left))}
.marca{display:flex;align-items:center;gap:7px;font:700 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.marca::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
h1{font:700 26px/1.05 var(--display);margin:7px 0 0;letter-spacing:-.01em;text-wrap:balance}
h2{font:600 18px/1.15 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.topo-dir{display:flex;align-items:center;gap:8px}
.icone-btn{appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icone-btn svg{width:21px;height:21px}
.sessao-topo{align-items:center}
.sessao-topo h1{font-size:18px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sessao-tit{flex:1;min-width:0;text-align:center}
.espaco{width:60px;flex:none}
.gps{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.gps::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.gps.bom::before{background:var(--accent)} .gps.medio::before{background:var(--warn)} .gps.ruim::before{background:var(--bad)}

/* ---------- base ---------- */
.conteudo{max-width:672px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.meta{color:var(--muted);font-size:14px;margin:0}
.secao{font:600 11px/1 var(--display);text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:14px 0 0}
.nota{font-size:14px;color:var(--muted);margin:0}
.vazio{color:var(--muted);text-align:center;padding:24px 8px;margin:0}
.aviso{background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));padding:10px 12px;border-radius:12px;font-size:14px}
.aviso[hidden]{display:none}
.rotulo{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.num,.v{font:600 26px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.u{font:700 13px var(--body);color:var(--muted);margin-left:4px;letter-spacing:0}

.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:700 16px var(--body);padding:12px 16px;border-radius:14px;cursor:pointer;min-height:50px}
.btn-primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-perigo{background:var(--bad);border-color:var(--bad);color:#160302}
.btn-peq{min-height:38px;padding:7px 14px;font-size:15px;border-radius:999px}
.btn:disabled{opacity:.4;cursor:default}
.btn-texto{appearance:none;background:none;border:0;color:var(--accent);font:700 15px var(--body);padding:8px 4px;cursor:pointer;text-align:left}
.btn-texto:disabled{color:var(--muted);opacity:.5;cursor:default}
.perigo,.btn-perigo-texto{color:var(--bad)}
.btn-perigo-texto{appearance:none;background:none;border:0;font:700 15px var(--body);padding:14px;cursor:pointer}
.chip{display:inline-block;font:700 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:5px 8px;border-radius:999px;vertical-align:2px;margin-left:8px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;color:var(--muted);font:700 14px var(--body);padding:9px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.resumo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.resumo.tres{grid-template-columns:repeat(3,1fr)}
.resumo>div{background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.destaque{flex-direction:row;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:linear-gradient(135deg,var(--accent-dim),var(--surface) 70%)}

/* ---------- início ---------- */
.hero{padding:8px 2px 4px;display:flex;flex-direction:column;gap:6px}
.saudacao{font:700 34px/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.saudacao em{font-style:normal;color:var(--accent)}
.escolhas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.escolha{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 16px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:190px;position:relative;overflow:hidden}
.escolha::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.escolha .ico{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.escolha .ico svg{width:28px;height:28px}
.escolha strong{font:700 20px/1.1 var(--display);letter-spacing:-.01em}
.escolha .meta{margin-top:auto}
.escolha:active{transform:scale(.98)}

/* ---------- academia ---------- */
.ficha-top{display:flex;gap:12px;align-items:center}
.ficha-info{min-width:0}
.letra{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:700 22px/1 var(--display);background:var(--soft);border:1px solid var(--line)}
.proxima{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.proxima .letra{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lista-ex{margin:0;font-size:14px;color:color-mix(in srgb,var(--ink) 80%,var(--muted))}
.tabela-ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tabela-ex li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tabela-ex li:first-child{border-top:0}
.tabela-ex .tab{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.contador{font:600 16px var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.completo{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.completo .contador{color:var(--accent)}
.ultima{margin:0;font-size:13px;background:var(--soft);padding:8px 10px;border-radius:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.series{display:flex;flex-direction:column;gap:6px}
.serie{display:grid;grid-template-columns:34px 1fr 1fr 54px;gap:8px;align-items:center}
.serie.cab span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;text-align:center}
.serie .n{text-align:center;font:600 16px var(--display);color:var(--muted)}
input,select{font:600 17px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:46px;font-variant-numeric:tabular-nums}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.serie input{text-align:center;font-size:18px;padding:10px 4px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.6;font-weight:500}
textarea{font:500 15px/1.45 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical;min-height:140px}
.check{appearance:none;width:54px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:22px;font-weight:700;cursor:pointer}
.feita .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feita input{background:var(--accent-dim);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.ex-acoes{display:flex;gap:14px}

#descanso{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--soft);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#descanso[hidden],body:not([data-tela="sessao"]) #descanso{display:none}
.d-barra-wrap{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 auto 10px;max-width:640px}
#d-barra{height:100%;background:var(--accent);transform-origin:left;transition:transform .25s linear}
.d-linha{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:640px;margin:0 auto}
#d-rotulo{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
#d-tempo{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.d-botoes{display:flex;gap:6px}
.d-botoes button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--body);padding:10px 11px;border-radius:12px;min-height:44px;cursor:pointer}
#descanso.fim{background:var(--accent);color:var(--accent-ink)}
#descanso.fim #d-rotulo{color:var(--accent-ink)}
#descanso.fim .d-botoes button{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent)}

.form{gap:6px}
.form label,.ed-linha2 label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.form label+input,.form label+select{margin-bottom:8px}
.ed-linha1{display:flex;gap:10px;align-items:center}
.ed-linha1 .n{font:600 18px var(--display);color:var(--muted);width:22px;text-align:center;flex:none}
.ed-linha2{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.ed-acoes{display:flex;gap:14px;justify-content:flex-end}
.arquivo{display:flex;align-items:center;justify-content:center;text-align:center}
.exemplo{background:var(--soft);border-radius:10px;padding:10px 12px;font:500 13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:8px 0 6px;overflow-x:auto}
.linha-botoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linha-botoes .btn:only-child{grid-column:1 / -1}
details>summary.btn-texto{list-style:none;display:inline-block}
details>summary.btn-texto::-webkit-details-marker{display:none}

/* ---------- gráficos ---------- */
.evo-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.evo-stats>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.evo-stats strong{font:600 17px/1.15 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bom{color:var(--accent)}
.grafico{width:100%;height:auto;display:block;margin-top:4px}
.grafico text{fill:var(--muted);font:600 10px var(--body)}
.grafico .g-rot{fill:var(--ink);font-weight:700;font-size:11px}
.g-grade{stroke:var(--line);stroke-width:1}
.g-area{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.g-linha{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-ponto{fill:var(--accent)}
.g-fim{fill:var(--accent);stroke:var(--surface);stroke-width:3}

.hist summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.hist summary>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hist-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist-ex{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hist-ex li{display:flex;flex-direction:column;font-size:14px}
.hist-ex .tab{color:var(--muted);font-variant-numeric:tabular-nums}
.hist .btn-texto{align-self:flex-start}
.hist-item{appearance:none;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink);cursor:pointer;font:inherit}
.hist-item strong{font:600 20px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hist-dir{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- corrida ---------- */
#mapa-wrap{max-width:672px;margin:12px auto 0;padding:0 max(16px,env(safe-area-inset-left))}
#mapa-wrap[hidden]{display:none}
.mapa-box{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
#mapa{height:min(40vh,360px);width:100%}
.mapa-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:14px;z-index:400;pointer-events:none}
.mapa-msg[hidden]{display:none}
.centralizar{position:absolute;right:10px;bottom:10px;z-index:500;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.centralizar[hidden]{display:none}
.leaflet-container{font-family:var(--body);background:#0b0c0b}
.leaflet-control-attribution{background:rgba(6,7,6,.7)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.principal{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.principal>div,.grade>div{background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.principal .big{grid-column:1 / -1;align-items:center;padding:16px}
.principal .v{font-size:28px}
.principal .big .v{font-size:58px;color:var(--accent)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.grade .v{font-size:21px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);text-align:left;font-weight:700;padding:0 0 6px}
td{padding:8px 0;border-top:1px solid var(--line)}
th:not(:first-child),td:not(:first-child){text-align:right}
.melhor td{color:var(--accent);font-weight:700}

/* ---------- rodapé ---------- */
#rodape{position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
body[data-tela="sessao"] #rodape,body[data-tela="editor"] #rodape,body[data-tela="perfil"] #rodape,body[data-tela="foto"] #rodape,body[data-tela="dia"] #rodape,body[data-tela="outra"] #rodape{display:none}
#controles{display:flex;gap:10px;max-width:672px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left)) 2px}
#controles[hidden]{display:none}
#controles .btn{flex:1;min-height:56px;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase}
#controles .btn.leve{font:700 15px var(--body);text-transform:none;letter-spacing:0}
#nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:672px;margin:0 auto;padding:6px max(8px,env(safe-area-inset-left)) 6px}
#nav button{appearance:none;background:none;border:0;color:var(--muted);font:700 10.5px var(--body);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;cursor:pointer;position:relative}
#nav button svg{width:23px;height:23px}
#nav button[aria-current="page"]{color:var(--accent)}
#nav .ponto{position:absolute;top:4px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

#dlg{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);display:grid;place-items:end center;padding:16px}
#dlg[hidden]{display:none}
.dlg-box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom)}
.dlg-botoes{display:flex;gap:8px}
.dlg-botoes .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:300;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
#toast[hidden]{display:none}

/* ---------- calendário e fotos ---------- */
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-top h2{font-size:19px}
.cal-nav{appearance:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px var(--body);cursor:pointer;flex:none}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-sem,.cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-sem span{text-align:center;font:700 10px var(--display);letter-spacing:.1em;color:var(--muted);padding:2px 0}
.cal-dia{position:relative;aspect-ratio:3/4;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;padding:0;appearance:none;color:var(--ink);font:inherit;display:block;width:100%;min-width:0}
.cal-dia.pad{background:transparent;border-color:transparent}
.cal-dia.futuro{opacity:.4}
.cal-dia img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cal-dia .n{position:absolute;top:5px;left:6px;font:700 12px var(--display);z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.9)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* =====================================================================
   Utilidades
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || "").trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const num = x => parseFloat(String(x ?? "").replace(",", ".")) || 0;
const fmtKg = n => Number(n || 0).toLocaleString("pt-BR", {maximumFractionDigits: 1});
const fmtTon = v => v >= 1000 ? (v / 1000).toLocaleString("pt-BR", {maximumFractionDigits: 1}) + " t" : fmtKg(v) + " kg";
const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
const fmtSeg = s => mmss(+s || 0);
const hora = ts => new Date(ts).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
const dataCurta = ts => new Date(ts).toLocaleDateString("pt-BR", {day: "2-digit", month: "2-digit"});
const dataLonga = ts => new Date(ts).toLocaleDateString("pt-BR", {weekday: "short", day: "numeric", month: "short"});
const dataHora = ts => dataLonga(ts) + " · " + hora(ts);
function decorrido(ts){
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000)), h = Math.floor(s / 3600);
  return h ? h + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0") : mmss(s);
}
function fmtTempo(ms){
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0");
}
function fmtPace(segPorKm){
  if (!isFinite(segPorKm) || segPorKm <= 0 || segPorKm > 3600) return "--:--";
  const s = Math.round(segPorKm);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const fmtKm = m => (m / 1000).toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtM = m => Math.round(m).toLocaleString("pt-BR");
function diasAtras(ts){
  const d0 = new Date(); d0.setHours(0,0,0,0);
  const d1 = new Date(ts); d1.setHours(0,0,0,0);
  const d = Math.round((d0 - d1) / 864e5);
  return d <= 0 ? "hoje" : d === 1 ? "ontem" : "há " + d + " dias";
}
const repsAlvo = r => (String(r).match(/\d+/) || [""])[0];
function letra(nome){
  const t = String(nome || "").trim();
  const m = t.match(/(?:^|\s)([A-Za-z0-9])$/);
  return (m ? m[1] : (t[0] || "?")).toUpperCase();
}
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

const ICONES = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>',
  academia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>',
  corrida: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="5.5" r="2"/><path d="M7.5 18.5H14a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6.5"/></svg>',
  historico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5.5 15l4.5-5 3.5 3 5.5-7"/></svg>',
  calendario: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.6-2.2h5.4L16.3 7h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  outra: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12h4l2.5-7 5 14 2.5-7h5"/></svg>',
  perfil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.4-3.8 4.3-5.5 7.5-5.5s6.1 1.7 7.5 5.5"/></svg>'
};

/* =====================================================================
   Estado
   ===================================================================== */
const EXEMPLOS = [
  {id:"ex-a", nome:"Treino A", foco:"Peito, ombro e tríceps", exercicios:[
    {id:"ex-a1", nome:"Supino reto com barra", series:4, reps:"8-10", descanso:120},
    {id:"ex-a2", nome:"Supino inclinado com halteres", series:3, reps:"10-12", descanso:90},
    {id:"ex-a3", nome:"Desenvolvimento com halteres", series:3, reps:"10-12", descanso:90},
    {id:"ex-a4", nome:"Elevação lateral", series:3, reps:"12-15", descanso:60},
    {id:"ex-a5", nome:"Tríceps na polia", series:3, reps:"12-15", descanso:60}]},
  {id:"ex-b", nome:"Treino B", foco:"Costas e bíceps", exercicios:[
    {id:"ex-b1", nome:"Puxada frontal", series:4, reps:"8-10", descanso:90},
    {id:"ex-b2", nome:"Remada curvada", series:4, reps:"8-10", descanso:120},
    {id:"ex-b3", nome:"Remada baixa na polia", series:3, reps:"10-12", descanso:90},
    {id:"ex-b4", nome:"Rosca direta com barra", series:3, reps:"10-12", descanso:60},
    {id:"ex-b5", nome:"Rosca martelo", series:3, reps:"12", descanso:60}]},
  {id:"ex-c", nome:"Treino C", foco:"Pernas", exercicios:[
    {id:"ex-c1", nome:"Agachamento livre", series:4, reps:"6-8", descanso:150},
    {id:"ex-c2", nome:"Leg press 45°", series:4, reps:"10-12", descanso:120},
    {id:"ex-c3", nome:"Cadeira extensora", series:3, reps:"12-15", descanso:60},
    {id:"ex-c4", nome:"Mesa flexora", series:3, reps:"10-12", descanso:60},
    {id:"ex-c5", nome:"Panturrilha em pé", series:4, reps:"15", descanso:45}]}
];
const OP_DESC = [30, 45, 60, 75, 90, 120, 150, 180, 240];
const S = {
  fichas: null, sessoes: [], outras: [], novaOutra: null, ativo: LS.get("dt_ativo", null),
  tela: "inicio", subAcad: "treinar", subHist: "academia", runVendo: null, voltarPara: "inicio",
  editor: null, evoEx: null, carregando: true, aviso: "",
  perfil: {nome: "", descansoPadrao: 90},
  importTexto: "", importacao: null, importando: false, exportTexto: "",
  calMes: [new Date().getFullYear(), new Date().getMonth()], diaSel: null, fotoPendente: null, fotoSalvando: false
};
const store = {mode: "local", col: null, fotos: null};
const filas = {};

/* =====================================================================
   Gravação (conta Claude quando disponível, senão este navegador)
   ===================================================================== */
async function tentar(fn){
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); return fn(); }
    throw e;
  }
}
function enfileirar(id, fn){ const p = (filas[id] || Promise.resolve()).then(() => tentar(fn)).catch(falhaEscrita); filas[id] = p; return p; }
function falhaEscrita(e){
  toast(e && e.code === "quota_exceeded" ? "O espaço de dados está cheio. Exclua treinos antigos no Histórico." : "Não consegui salvar agora. Confira a conexão e tente de novo.");
}
function salvarFichas(){
  if (store.mode === "db") enfileirar("fichas", () => store.col.doc("fichas").set({list: clone(S.fichas), atualizado: Date.now()}));
  else LS.set("dt_fichas", S.fichas);
}
function salvarSessao(s){
  if (store.mode === "db") enfileirar("s_" + s.id, () => store.col.doc("s_" + s.id).set(clone(s)));
  else LS.set("dt_sessoes", S.sessoes);
}
function apagarSessao(id){
  if (store.mode === "db") enfileirar("s_" + id, () => store.col.doc("s_" + id).delete());
  else LS.set("dt_sessoes", S.sessoes);
}
function salvarOutra(o){
  if (store.mode === "db") enfileirar("o_" + o.id, () => store.col.doc("o_" + o.id).set(clone(o)));
  else LS.set("dt_outras", S.outras);
}
function apagarOutra(id){
  if (store.mode === "db") enfileirar("o_" + id, () => store.col.doc("o_" + id).delete());
  else LS.set("dt_outras", S.outras);
}
function salvarPerfil(){
  if (store.mode === "db") enfileirar("perfil", () => store.col.doc("perfil").set(clone(S.perfil)));
  else LS.set("dt_perfil", S.perfil);
}
const salvarAtivo = () => S.ativo ? LS.set("dt_ativo", S.ativo) : LS.del("dt_ativo");
function adotarExemplos(){ if (S.fichas === null) { S.fichas = clone(EXEMPLOS); salvarFichas(); } }
const listaFichas = () => S.fichas === null ? EXEMPLOS : S.fichas;

async function carregarDados(){
  render();
  let pronto = false;
  const local = msg => {
    if (pronto) return; pronto = true;
    store.mode = "local";
    S.fichas = LS.get("dt_fichas", null);
    S.sessoes = LS.get("dt_sessoes", []);
    S.outras = LS.get("dt_outras", []);
    S.perfil = Object.assign({nome: "", descansoPadrao: 90}, LS.get("dt_perfil", {}));
    S.carregando = false; if (msg) S.aviso = msg;
    renderSeLivre();
  };
  const c = window.claude;
  if (!c || typeof c.use !== "function") return local("");
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return local("");
    const uid = await user.id();
    if (!uid) return local("");
    store.mode = "db";
    store.col = db.collection("data/users/" + uid);
    store.fotos = db.doc("data/users/" + uid + "/midia").collection("fotos");
    const timer = setTimeout(() => {
      if (S.carregando) { S.carregando = false; S.aviso = "Ainda não consegui carregar seus treinos. Confira a conexão; eles aparecem assim que ela voltar."; renderSeLivre(); }
    }, 10000);
    store.col.onSnapshot(snap => {
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (S.aviso.startsWith("Ainda não")) S.aviso = ""; }
      let fichas = null; const ses = [], outras = [];
      snap.docs.forEach(d => {
        if (!d.exists) return;
        const v = d.data();
        if (d.id === "fichas") fichas = clone(v.list || []);
        else if (d.id === "perfil") S.perfil = Object.assign({nome: "", descansoPadrao: 90}, clone(v));
        else if (d.id.startsWith("s_")) ses.push(clone(v));
        else if (d.id.startsWith("o_")) outras.push(clone(v));
      });
      pronto = true;
      S.fichas = fichas; S.sessoes = ses.sort((a, b) => b.inicio - a.inicio); S.outras = outras.sort((a, b) => b.inicio - a.inicio); S.carregando = false;
      renderSeLivre();
    }, () => { clearTimeout(timer); S.carregando = false; S.aviso = "A sincronização parou. Recarregue a página para tentar de novo."; renderSeLivre(); });
  } catch { local(""); }
}
function renderSeLivre(){ if (!["sessao", "editor", "perfil", "foto", "outra"].includes(S.tela)) render(); }

/* =====================================================================
   Cálculos — academia
   ===================================================================== */
const volume = s => s.exercicios.reduce((a, e) => a + e.series.reduce((b, x) => b + num(x.peso) * num(x.reps), 0), 0);
const nSeries = s => s.exercicios.reduce((a, e) => a + e.series.length, 0);
const seriesFeitas = a => a.exercicios.reduce((n, e) => n + e.series.filter(x => x.feito).length, 0);
const duracaoEstimada = f => Math.round(f.exercicios.reduce((a, e) => a + (+e.series || 0) * (45 + (+e.descanso || 0)), 0) / 60);
function ultimaVez(nome){
  const k = norm(nome);
  for (const s of S.sessoes) { const e = s.exercicios.find(x => norm(x.nome) === k); if (e && e.series.length) return {data: s.inicio, series: e.series}; }
  return null;
}
function proximaFicha(fichas){
  if (!fichas.length) return null;
  const ult = S.sessoes[0];
  if (!ult) return fichas[0].id;
  const i = fichas.findIndex(f => f.id === ult.fichaId);
  return i < 0 ? fichas[0].id : fichas[(i + 1) % fichas.length].id;
}
function nomesExercicios(){
  const vistos = new Map();
  S.sessoes.forEach(s => s.exercicios.forEach(e => { if (!vistos.has(norm(e.nome))) vistos.set(norm(e.nome), e.nome); }));
  return [...vistos.values()];
}
function pontosEvolucao(nome){
  const k = norm(nome), out = [];
  [...S.sessoes].sort((a, b) => a.inicio - b.inicio).forEach(s => {
    const e = s.exercicios.find(x => norm(x.nome) === k);
    if (!e || !e.series.length) return;
    let best = null, e1 = 0;
    e.series.forEach(x => {
      const p = num(x.peso), r = num(x.reps);
      if (!best || p > best.peso || (p === best.peso && r > best.reps)) best = {peso: p, reps: r};
      e1 = Math.max(e1, p * (1 + r / 30));
    });
    out.push({data: s.inicio, peso: best.peso, reps: best.reps, e1rm: e1});
  });
  return out;
}

/* =====================================================================
   Corrida — GPS, filtros e mapa
   ===================================================================== */
const PRECISAO_MAX = 35, PASSO_MIN = 4, VELOC_MAX = 11, LIMIAR_ALT = 3, JANELA_PACE = 30000;
const VERDE = "#ccff00";
const R = {c: null, status: "parado", ultimaPos: null, watchId: null, wakeLock: null, seguir: true, linha: null};
function dist(a, b){
  const Rt = 6371000, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * Rt * Math.asin(Math.sqrt(x));
}
function novaCorrida(){
  return {id: Date.now().toString(36), inicio: Date.now(), acumulado: 0, retomadoEm: null, segmentos: [[]], distancia: 0,
    ganho: 0, perda: 0, altSuave: null, altRef: null, altMin: null, altMax: null, splits: [], novoSegmento: false};
}
const tempoCorrida = c => c.acumulado + (c.retomadoEm ? Date.now() - c.retomadoEm : 0);
const todosPontos = c => c.segmentos.flat();
function paceAtual(c){
  const seg = c.segmentos[c.segmentos.length - 1];
  if (!seg || seg.length < 2) return NaN;
  const agora = seg[seg.length - 1].t;
  let d = 0, i = seg.length - 1;
  while (i > 0 && seg[i - 1].t >= agora - JANELA_PACE) { d += dist(seg[i - 1], seg[i]); i--; }
  const dt = (agora - seg[i].t) / 1000;
  return (d < 20 || dt < 8) ? NaN : dt / (d / 1000);
}

let mapa = null, camada = null, marcador = null, precisaoCirc = null;
function prepararMapa(){
  if (!mapa) {
    if (!window.L) { $("#mapa-msg").textContent = "Não consegui carregar o mapa. Confira a internet; os números continuam funcionando."; $("#mapa-msg").hidden = false; return; }
    mapa = L.map("mapa", {zoomControl: false}).setView([-25.4284, -49.2733], 13);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 20, subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(mapa);
    camada = L.layerGroup().addTo(mapa);
    mapa.on("dragstart", () => { R.seguir = false; $("#btn-centralizar").hidden = false; });
  }
  setTimeout(() => mapa && mapa.invalidateSize(), 60);
}
function desenharTrajeto(c, ajustar){
  if (!mapa) return;
  camada.clearLayers(); R.linha = null;
  c.segmentos.forEach(seg => { if (seg.length > 1) L.polyline(seg.map(p => [p.lat, p.lon]), {color: VERDE, weight: 5, opacity: .95, lineJoin: "round"}).addTo(camada); });
  const pts = todosPontos(c);
  if (pts.length) {
    L.circleMarker([pts[0].lat, pts[0].lon], {radius: 6, color: "#060706", weight: 3, fillColor: "#ffffff", fillOpacity: 1}).addTo(camada).bindTooltip("Largada");
    if (ajustar && pts.length > 1) setTimeout(() => mapa.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lon])), {padding: [28, 28]}), 80);
  }
}
function estenderLinha(p){
  if (!mapa) return;
  if (!R.linha || R.c.novoSegmentoDesenho) { R.linha = L.polyline([], {color: VERDE, weight: 5, opacity: .95, lineJoin: "round"}).addTo(camada); R.c.novoSegmentoDesenho = false; }
  R.linha.addLatLng([p.lat, p.lon]);
}
function moverMarcador(pos){
  if (!mapa) return;
  const ll = [pos.lat, pos.lon];
  if (!marcador) {
    marcador = L.circleMarker(ll, {radius: 8, color: "#060706", weight: 3, fillColor: VERDE, fillOpacity: 1}).addTo(mapa);
    precisaoCirc = L.circle(ll, {radius: pos.acc, color: VERDE, weight: 1, opacity: .4, fillOpacity: .08}).addTo(mapa);
    mapa.setView(ll, 17);
  } else {
    marcador.setLatLng(ll); precisaoCirc.setLatLng(ll).setRadius(pos.acc);
    if (S.tela === "corrida" && !mapa.hasLayer(marcador)) { marcador.addTo(mapa); precisaoCirc.addTo(mapa); }
  }
  if (R.seguir && S.tela === "corrida") mapa.panTo(ll, {animate: true});
  if (S.tela === "corrida") $("#mapa-msg").hidden = true;
}
function ligarGPS(){
  if (R.watchId !== null) return;
  if (!("geolocation" in navigator)) return erroGPS({code: 0});
  if (!window.isSecureContext) return erroGPS({code: -1});
  atualizarGpsChip("Procurando GPS…", "");
  try { R.watchId = navigator.geolocation.watchPosition(aoPosicionar, erroGPS, {enableHighAccuracy: true, maximumAge: 0, timeout: 20000}); }
  catch { erroGPS({code: -2}); }
}
function desligarGPS(){
  if (R.watchId !== null) { try { navigator.geolocation.clearWatch(R.watchId); } catch {} }
  R.watchId = null; atualizarGpsChip("GPS desligado", "");
}
function atualizarGpsChip(txt, cls){ R.gpsTxt = txt; R.gpsCls = cls; const g = $("#gps"); if (g) { g.textContent = txt; g.className = "gps " + cls; } }
function erroGPS(e){
  const msgs = {
    [-2]: "A localização está bloqueada nesta janela. Abra o Fôlego pelo link próprio dele (no Safari ou pela Tela de Início) para usar a corrida.",
    [-1]: "A localização só funciona com a página aberta em https://.",
    0: "Este navegador não oferece localização.",
    1: "Você não permitiu a localização. No iPhone: Ajustes › Privacidade e Segurança › Serviços de Localização › Sites do Safari › Ao Usar o App, com Localização Precisa ligada. Depois recarregue a página.",
    2: "Não consegui achar sua posição. Vá para um lugar a céu aberto e aguarde alguns segundos."
  };
  if (e.code === 3) { atualizarGpsChip("Sinal fraco", "ruim"); return; }
  if (e.code === 1 && window.claude) e = {code: -2};
  mostrarAvisoGps(msgs[e.code] || msgs[2]);
  if ([1, 0, -1, -2].includes(e.code)) { desligarGPS(); if (R.status === "correndo") corPausar(); }
}
function aoPosicionar(pos){
  const c = pos.coords;
  const p = {lat: c.latitude, lon: c.longitude, t: pos.timestamp || Date.now(), acc: c.accuracy, alt: c.altitude == null ? null : c.altitude};
  atualizarGpsChip("GPS ±" + Math.round(p.acc) + " m", p.acc <= 12 ? "bom" : p.acc <= PRECISAO_MAX ? "medio" : "ruim");
  R.ultimaPos = p;
  moverMarcador(p);
  if (R.status !== "correndo" || !R.c || p.acc > PRECISAO_MAX) { if (S.tela === "corrida") atualizarNumeros(); return; }
  registrarPonto(p);
}
function registrarPonto(p){
  const c = R.c;
  let seg = c.segmentos[c.segmentos.length - 1];
  if (c.novoSegmento) { if (seg.length) { seg = []; c.segmentos.push(seg); } c.novoSegmento = false; c.novoSegmentoDesenho = true; }
  const ant = seg[seg.length - 1];
  if (ant) {
    const d = dist(ant, p), dt = (p.t - ant.t) / 1000;
    if (d < PASSO_MIN) return;
    if (dt > 0 && d / dt > VELOC_MAX) return;
    const kmAntes = Math.floor(c.distancia / 1000);
    c.distancia += d;
    const kmDepois = Math.floor(c.distancia / 1000);
    if (kmDepois > kmAntes) {
      const t = tempoCorrida(c), antes = c.splits.reduce((a, s) => a + s, 0);
      c.splits.push(t - antes);
      toast(`${kmDepois} km · ${fmtTempo(t - antes)} neste km`);
      try { navigator.vibrate && navigator.vibrate(300); } catch {}
    }
  }
  // altitude suavizada com histerese para o ruído do GPS não inflar a subida
  if (p.alt !== null) {
    c.altSuave = c.altSuave === null ? p.alt : c.altSuave * 0.75 + p.alt * 0.25;
    if (c.altRef === null) c.altRef = c.altSuave;
    const dif = c.altSuave - c.altRef;
    if (dif >= LIMIAR_ALT) { c.ganho += dif; c.altRef = c.altSuave; }
    else if (dif <= -LIMIAR_ALT) { c.perda -= dif; c.altRef = c.altSuave; }
    c.altMin = c.altMin === null ? c.altSuave : Math.min(c.altMin, c.altSuave);
    c.altMax = c.altMax === null ? c.altSuave : Math.max(c.altMax, c.altSuave);
  }
  const ponto = {lat: +p.lat.toFixed(6), lon: +p.lon.toFixed(6), t: p.t, alt: c.altSuave === null ? null : +c.altSuave.toFixed(1), d: Math.round(c.distancia)};
  seg.push(ponto);
  if (S.tela === "corrida") estenderLinha(ponto); else c.novoSegmentoDesenho = true;
  salvarCorridaAtiva();
  if (S.tela === "corrida") atualizarNumeros();
}
async function manterTelaLigada(){
  try { if ("wakeLock" in navigator && !R.wakeLock) { R.wakeLock = await navigator.wakeLock.request("screen"); R.wakeLock.addEventListener("release", () => { R.wakeLock = null; }); } } catch {}
}
function liberarTela(){ try { R.wakeLock && R.wakeLock.release(); } catch {} R.wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && R.status === "correndo") { manterTelaLigada(); atualizarNumeros(); }
});
let ultimoSalvamentoCorrida = 0;
function salvarCorridaAtiva(forcar){
  const agora = Date.now();
  if (!forcar && agora - ultimoSalvamentoCorrida < 3000 && R.status === "correndo") return;
  ultimoSalvamentoCorrida = agora;
  LS.set("rn_ativa", {corrida: R.c, status: R.status});
}
function corIniciar(){
  R.c = novaCorrida(); R.c.retomadoEm = Date.now(); R.status = "correndo"; R.seguir = true; R.linha = null;
  if (camada) camada.clearLayers();
  ligarGPS(); manterTelaLigada(); salvarCorridaAtiva(true); render();
}
function corPausar(){
  if (R.status !== "correndo") return;
  R.c.acumulado = tempoCorrida(R.c); R.c.retomadoEm = null; R.status = "pausado"; salvarCorridaAtiva(true); render();
}
function corContinuar(){
  if (S.aviso.startsWith("Uma corrida")) S.aviso = "";
  R.c.retomadoEm = Date.now(); R.c.novoSegmento = true; R.status = "correndo";
  ligarGPS(); manterTelaLigada(); salvarCorridaAtiva(true); render();
}
function corEncerrar(){
  if (R.status === "correndo") corPausar();
  if (R.c.distancia < 50) {
    dialogo("Descartar corrida?", "O percurso registrado tem menos de 50 m, curto demais para salvar.", [{t: "Voltar"}, {t: "Descartar", perigo: true, fn: corDescartar}]);
    return;
  }
  dialogo("Finalizar corrida?", `${fmtKm(R.c.distancia)} km em ${fmtTempo(tempoCorrida(R.c))}.`,
    [{t: "Voltar"}, {t: "Descartar", perigo: true, fn: () => dialogo("Descartar mesmo?", "A corrida não vai para o histórico.", [{t: "Manter"}, {t: "Descartar", perigo: true, fn: corDescartar}])},
     {t: "Salvar", primario: true, fn: corSalvar}]);
}
function corSalvar(){
  const c = R.c, passo = Math.max(1, Math.ceil(todosPontos(c).length / 1500));
  const r = {id: c.id, inicio: c.inicio, fim: Date.now(), tempo: tempoCorrida(c), distancia: c.distancia, ganho: c.ganho, perda: c.perda,
    altMin: c.altMin, altMax: c.altMax, splits: c.splits,
    segmentos: c.segmentos.map(s => s.filter((p, i) => i % passo === 0 || i === s.length - 1)).filter(s => s.length)};
  const hist = LS.get("rn_hist", []); hist.unshift(r);
  if (!LS.set("rn_hist", hist)) { hist.pop(); LS.set("rn_hist", hist); toast("Memória cheia: a corrida mais antiga foi removida"); }
  corLimpar();
  S.fotoPendente = {key: "c_" + r.id, tipo: "c", titulo: fmtKm(r.distancia) + " km", detalhe: `${fmtTempo(r.tempo)} · pace ${fmtPace(r.tempo / 1000 / (r.distancia / 1000))} /km · subida ${fmtM(r.ganho)} m`};
  irPara("foto");
}
function corDescartar(){ corLimpar(); render(); }
function corLimpar(){
  R.c = null; R.status = "parado"; R.linha = null; LS.del("rn_ativa");

}

function render(){
  if (S.tela === "sessao" && !S.ativo) S.tela = "academia";
  if (S.tela === "editor" && !S.editor) { S.tela = "academia"; S.subAcad = "fichas"; }
  document.body.dataset.tela = S.tela;
  const runResumo = S.tela === "historico" && S.subHist === "corrida" && S.runVendo;
  const mostraMapa = S.tela === "corrida" || !!runResumo;
  $("#mapa-wrap").hidden = !mostraMapa;
  let v;
  switch (S.tela) {
    case "sessao": v = vSessao(); break;
    case "editor": v = vEditor(); break;
    case "perfil": v = vPerfil(); break;
    case "academia": v = vAcademia(); break;
    case "corrida": v = vCorrida(); break;
    case "historico": v = vHistorico(); break;
    case "calendario": v = vCalendario(); break;
    case "dia": v = vDia(); break;
    case "foto": v = vFoto(); break;
    case "outra": v = vOutra(); break;
    default: v = vInicio();
  }
  $("#topo").innerHTML = v.topo;
  $("#conteudo").innerHTML = (S.aviso && !["sessao", "editor"].includes(S.tela) ? `<div class="aviso">${esc(S.aviso)}</div>` : "") + v.corpo;
  $("#controles").innerHTML = v.controles || "";
  $("#controles").hidden = !v.controles;
  document.body.classList.toggle("com-controles", !!v.controles);
  $("#nav").innerHTML = vNav();
  if (S.tela === "dia") carregarFotosDia();
  if (mostraMapa) {
    prepararMapa();
    if (!mapa) return;
    if (runResumo) {
      const r = LS.get("rn_hist", []).find(x => x.id === S.runVendo);
      if (marcador && mapa.hasLayer(marcador)) { mapa.removeLayer(marcador); mapa.removeLayer(precisaoCirc); }
      if (r) desenharTrajeto(r, true);
      $("#mapa-msg").hidden = true; $("#btn-centralizar").hidden = false;
    } else {
      if (R.c) { desenharTrajeto(R.c, false); R.c.novoSegmentoDesenho = true; } else camada.clearLayers();
      if (marcador && !mapa.hasLayer(marcador)) { marcador.addTo(mapa); precisaoCirc.addTo(mapa); }
      $("#mapa-msg").hidden = !!R.ultimaPos;
      $("#btn-centralizar").hidden = R.seguir;
      if (R.ultimaPos && R.seguir) setTimeout(() => mapa.setView([R.ultimaPos.lat, R.ultimaPos.lon], Math.max(mapa.getZoom(), 16)), 80);
      atualizarNumeros(true);
    }
  }
}

let ultimoGrafico = 0;
function atualizarNumeros(forcarGrafico){
  if (S.tela !== "corrida" || !$("#n-tempo")) return;
  const c = R.c;
  if (!c) { if (R.ultimaPos && R.ultimaPos.alt !== null) $("#n-alt").textContent = fmtM(R.ultimaPos.alt); return; }
  const t = tempoCorrida(c);
  $("#n-dist").textContent = fmtKm(c.distancia);
  $("#n-tempo").textContent = fmtTempo(t);
  $("#n-pacem").textContent = c.distancia > 50 ? fmtPace(t / 1000 / (c.distancia / 1000)) : "--:--";
  $("#n-pacea").textContent = R.status === "correndo" ? fmtPace(paceAtual(c)) : "--:--";
  $("#n-alt").textContent = c.altSuave !== null ? fmtM(c.altSuave) : (R.ultimaPos && R.ultimaPos.alt !== null ? fmtM(R.ultimaPos.alt) : "—");
  $("#n-ganho").textContent = fmtM(c.ganho);
  if (forcarGrafico || Date.now() - ultimoGrafico > 4000) {
    ultimoGrafico = Date.now();
    const pts = todosPontos(c).filter(p => p.alt !== null);
    if (pts.length > 3) $("#alt-card").innerHTML = graficoAlt(pts) + `<p class="nota">Mín. ${fmtM(c.altMin)} m · máx. ${fmtM(c.altMax)} m · desceu ${fmtM(c.perda)} m</p>`;
    if (c.splits.length) $("#splits-card").innerHTML = tabelaSplits(c.splits);
  }
}
function graficoAlt(pts){
  const W = 340, H = 130, L0 = 38, R0 = 10, T = 10, B = 22;
  const passo = Math.max(1, Math.ceil(pts.length / 200));
  const p = pts.filter((x, i) => i % passo === 0 || i === pts.length - 1);
  const dMax = Math.max(p[p.length - 1].d, 1);
  let lo = Math.min(...p.map(x => x.alt)), hi = Math.max(...p.map(x => x.alt));
  if (hi - lo < 10) { const m = (hi + lo) / 2; lo = m - 5; hi = m + 5; }
  lo = Math.floor(lo); hi = Math.ceil(hi);
  const X = d => L0 + (W - L0 - R0) * (d / dMax), Y = a => T + (H - T - B) * (1 - (a - lo) / (hi - lo));
  const linha = p.map((x, i) => (i ? "L" : "M") + X(x.d).toFixed(1) + " " + Y(x.alt).toFixed(1)).join(" ");
  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de altitude de ${lo} a ${hi} metros ao longo de ${fmtKm(dMax)} km">`;
  [lo, Math.round((lo + hi) / 2), hi].forEach(v => { s += `<line class="g-grade" x1="${L0}" x2="${W - R0}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L0 - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${v} m</text>`; });
  s += `<path class="g-area" d="${linha} L${X(dMax).toFixed(1)} ${H - B} L${L0} ${H - B} Z"/><path class="g-linha" d="${linha}"/>`;
  s += `<text x="${L0}" y="${H - 6}">0 km</text><text x="${W - R0}" y="${H - 6}" text-anchor="end">${fmtKm(dMax)} km</text></svg>`;
  return s;
}
function tabelaSplits(splits){
  const melhor = Math.min(...splits);
  return `<table><thead><tr><th>Km</th><th>Tempo do km</th><th>Pace</th></tr></thead><tbody>${splits.map((ms, i) =>
    `<tr${ms === melhor && splits.length > 1 ? ' class="melhor"' : ""}><td>${i + 1}</td><td>${fmtTempo(ms)}</td><td>${fmtPace(ms / 1000)} /km</td></tr>`).join("")}</tbody></table>`;
}

function vEvolucao(nome){
  const p = pontosEvolucao(nome);
  if (!p.length) return "";
  const rec = p.reduce((a, b) => (b.peso > a.peso || (b.peso === a.peso && b.reps > a.reps)) ? b : a);
  const e1 = Math.max(...p.map(x => x.e1rm));
  const dif = p[p.length - 1].peso - p[0].peso;
  let h = `<div class="evo-stats">
    <div><span class="rotulo">Recorde</span><strong>${fmtKg(rec.peso)} kg × ${rec.reps}</strong><span class="meta">${dataCurta(rec.data)}</span></div>
    <div><span class="rotulo">1RM estimado</span><strong>${fmtKg(Math.round(e1 * 2) / 2)} kg</strong><span class="meta">fórmula de Epley</span></div>
    <div><span class="rotulo">Desde o início</span><strong class="${dif > 0 ? "bom" : ""}">${dif > 0 ? "+" : ""}${fmtKg(dif)} kg</strong><span class="meta">${p.length} ${p.length === 1 ? "treino" : "treinos"}</span></div></div>`;
  return h + (p.length < 2 ? '<p class="nota">Registre este exercício em mais um treino para ver a curva de evolução.</p>' : graficoCarga(p, nome));
}
function graficoCarga(p, nome){
  p = p.slice(-30);
  const W = 340, H = 170, L0 = 38, R0 = 16, T = 18, B = 24;
  let lo = Math.min(...p.map(x => x.peso)), hi = Math.max(...p.map(x => x.peso));
  if (hi - lo < 4) { lo -= 2; hi += 2; }
  lo = Math.max(0, Math.floor(lo)); hi = Math.ceil(hi);
  const X = i => L0 + (W - L0 - R0) * (i / (p.length - 1)), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga máxima por treino em ${esc(nome)}, de ${fmtKg(p[0].peso)} a ${fmtKg(p[p.length - 1].peso)} kg">`;
  [lo, Math.round((lo + hi) / 2 * 2) / 2, hi].forEach(t => { s += `<line x1="${L0}" x2="${W - R0}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" class="g-grade"/><text x="${L0 - 6}" y="${(Y(t) + 3).toFixed(1)}" text-anchor="end">${fmtKg(t)}</text>`; });
  const pts = p.map((x, i) => [X(i), Y(x.peso)]);
  const linha = pts.map((q, i) => (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1)).join(" ");
  s += `<path d="${linha} L${pts[pts.length - 1][0].toFixed(1)} ${H - B} L${pts[0][0].toFixed(1)} ${H - B} Z" class="g-area"/><path d="${linha}" class="g-linha"/>`;
  pts.slice(0, -1).forEach(q => { s += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" class="g-ponto"/>`; });
  const f = pts[pts.length - 1];
  s += `<circle cx="${f[0].toFixed(1)}" cy="${f[1].toFixed(1)}" r="5" class="g-fim"/><text class="g-rot" x="${(f[0] - 8).toFixed(1)}" y="${(f[1] - 9).toFixed(1)}" text-anchor="end">${fmtKg(p[p.length - 1].peso)} kg</text>`;
  return s + `<text x="${L0}" y="${H - 6}">${dataCurta(p[0].data)}</text><text x="${W - R0}" y="${H - 6}" text-anchor="end">${dataCurta(p[p.length - 1].data)}</text></svg>`;
}

function exportarGPX(){
  const r = LS.get("rn_hist", []).find(x => x.id === S.runVendo); if (!r) return;
  const trk = r.segmentos.map(s => "<trkseg>" + s.map(p => `<trkpt lat="${p.lat}" lon="${p.lon}">${p.alt !== null ? `<ele>${p.alt}</ele>` : ""}<time>${new Date(p.t).toISOString()}</time></trkpt>`).join("") + "</trkseg>").join("");
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Folego" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Corrida ${new Date(r.inicio).toLocaleDateString("pt-BR")}</name><type>running</type>${trk}</trk></gpx>`;
  const url = URL.createObjectURL(new Blob([xml], {type: "application/gpx+xml"}));
  const a = document.createElement("a");
  a.href = url; a.download = "corrida-" + new Date(r.inicio).toISOString().slice(0, 10) + ".gpx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function normalizarFichas(r){
  const arr = Array.isArray(r) ? r : (r && Array.isArray(r.fichas) ? r.fichas : []);
  return arr.map((f, k) => {
    f = f || {};
    const exs = (Array.isArray(f.exercicios) ? f.exercicios : []).map(e => {
      e = e || {};
      return {id: novoId(), nome: String(e.nome || "").trim().slice(0, 80),
        series: Math.min(10, Math.max(1, Math.round(num(e.series)) || 3)),
        reps: String(e.reps ?? "").trim().slice(0, 20) || "10",
        descanso: Math.min(600, Math.max(10, Math.round(num(e.descanso)) || +S.perfil.descansoPadrao || 90))};
    }).filter(e => e.nome);
    return {id: novoId(), nome: String(f.nome || "").trim().slice(0, 40) || "Treino " + "ABCDEFGHIJKL"[k % 12], foco: String(f.foco || "").trim().slice(0, 60), exercicios: exs};
  }).filter(f => f.exercicios.length).slice(0, 12);
}
async function interpretarComClaude(texto){
  const c = window.claude;
  if (!c || typeof c.use !== "function") return null;
  const sample = await c.use("sample");
  if (!sample) return null;
  const pad = +S.perfil.descansoPadrao || 90;
  const prompt = `Você recebe o texto em que um aluno de musculação escreveu todas as fichas de treino dele. Separe o texto em treinos (fichas) e exercícios.
Responda SOMENTE com JSON válido, sem comentários, neste formato:
{"fichas":[{"nome":"Treino A","foco":"Peito e tríceps","exercicios":[{"nome":"Supino reto","series":4,"reps":"8-10","descanso":120}]}]}
Regras:
- nome: o nome do treino como está no texto ("Treino A", "Segunda", "Superiores"). Se o texto não der nome, use Treino A, Treino B, Treino C… na ordem.
- foco: os grupos musculares, se estiverem escritos ou forem evidentes pelos exercícios; senão "".
- series: número inteiro de 1 a 10. Se não estiver escrito, use 3.
- reps: texto como está escrito ("10", "8-12", "falha", "30s"). Se não estiver escrito, use "10".
- descanso: em segundos. "2 min" = 120, "1'30" ou "1:30" = 90. Se não estiver escrito, use ${pad}.
- Técnicas como drop-set, bi-set ou rest-pause ficam no nome do exercício, entre parênteses.
- Ignore observações, aquecimento e textos que não sejam exercícios. Não invente exercícios.
TEXTO:
"""
${texto.slice(0, 20000)}
"""`;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 90000);
  try {
    if (typeof sample.json === "function") return await sample.json(prompt, {signal: ctrl.signal});
    const r = await sample(prompt, {signal: ctrl.signal});
    const m = String(r && r.text || "").match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : null;
  } finally { clearTimeout(t); }
}
function tituloFicha(s){
  s = s.trim();
  if (/^[a-z0-9]$/i.test(s)) return "Treino " + s.toUpperCase();
  if (s === s.toUpperCase()) s = s.toLowerCase();
  s = s.charAt(0).toUpperCase() + s.slice(1);
  return s.replace(/(\s)([a-z0-9])$/i, (m, e, c) => e + c.toUpperCase());
}
function interpretarExercicio(l){
  let series = null, reps = null, descanso = null, corte = l.length, fimSerie = -1;
  let m = l.match(/(\d{1,2})\s*[x×X]\s*(\d+(?:\s*(?:-|–|\/|a)\s*\d+)*(?:s\b)?|falha|m[áa]x\w*)/i);
  if (!m) m = l.match(/(\d{1,2})\s*s[ée]ries?\s*(?:de|x|×|com)?\s*(\d+(?:\s*(?:-|–|a)\s*\d+)?)?/i);
  if (m) {
    series = +m[1];
    if (m[2]) reps = /^\d/.test(m[2]) ? m[2].replace(/\s*(?:–|\/|a)\s*/g, "-").replace(/\s+/g, "") : m[2];
    corte = m.index; fimSerie = m.index + m[0].length;
  }
  const kw = l.search(/(?:^|[\s,;(|])(desc(?:anso)?|interv(?:alo)?|pausa)\b/i);
  const alvo = kw >= 0 ? l.slice(kw) : (fimSerie >= 0 ? l.slice(fimSerie) : "");
  if (alvo) {
    let d;
    if ((d = alvo.match(/(\d+)\s*'\s*(\d{1,2})/))) descanso = +d[1] * 60 + +d[2];
    else if ((d = alvo.match(/(\d+):(\d{2})/))) descanso = +d[1] * 60 + +d[2];
    else if ((d = alvo.match(/(\d+(?:[.,]\d+)?)\s*(?:min\b|minutos?|')/i))) descanso = Math.round(num(d[1]) * 60);
    else if ((d = alvo.match(/(\d+)\s*(?:s\b|seg\b|segundos|")/i))) descanso = +d[1];
    else if (kw >= 0 && (d = alvo.match(/(\d+)/))) descanso = +d[1];
  }
  if (kw >= 0) corte = Math.min(corte, kw);
  const nome = l.slice(0, corte).replace(/[\s:\-–—,;|(]+$/, "").trim();
  if (!nome || !/[a-zà-ú]/i.test(nome)) return null;
  return {nome, series: series || 3, reps: reps || "10", descanso: descanso || +S.perfil.descansoPadrao || 90};
}
function interpretarTexto(txt){
  const fichas = []; let atual = null;
  const nova = (nome, foco) => { atual = {nome, foco: foco || "", exercicios: []}; fichas.push(atual); };
  txt.replace(/\r/g, "").split("\n").forEach(raw => {
    const l = raw.replace(/^[\s>*•·\-–—]+/, "").replace(/^\d{1,2}\s*[.)]\s+/, "").trim();
    if (!l || /^(obs|observa|nota)/i.test(l)) return;
    const temSerie = /\d\s*[x×X]\s*\d|\d\s*s[ée]ries?/i.test(l);
    const cab = l.match(/^((?:treino|ficha|dia|day)\s*[A-Z0-9]{1,2}\b|(?:segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?)\s*[:\-–—()]*\s*(.*)$/i)
      || l.match(/^([A-Z])\s*[:\-–—)]\s*([^\d]*)$/);
    if (cab && !temSerie) { nova(tituloFicha(cab[1]), cab[2].replace(/[()]/g, "").trim()); return; }
    if (/:$/.test(l) && !/\d/.test(l)) { nova(tituloFicha(l.slice(0, -1)), ""); return; }
    const ex = interpretarExercicio(l);
    if (!ex) return;
    if (!atual) nova("Treino " + "ABCDEFGHIJKL"[fichas.length % 12], "");
    atual.exercicios.push(ex);
  });
  return fichas;
}
function fichasComoTexto(){
  return listaFichas().map(f => f.nome + (f.foco ? " - " + f.foco : "") + "\n" +
    f.exercicios.map(e => `${e.nome}: ${e.series}x${e.reps}, descanso ${e.descanso}s`).join("\n")).join("\n\n");
}

/* =====================================================================
   Fotos dos treinos
   Miniatura (quadrada, ~200 px) fica junto do treino; a foto grande fica
   na conta Claude (academia, quando sincronizado) ou no IndexedDB do aparelho.
   ===================================================================== */
const IDB = {
  abrir(){
    if (!this.p) this.p = new Promise((res, rej) => {
      try { const r = indexedDB.open("folego", 1); r.onupgradeneeded = () => r.result.createObjectStore("fotos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return this.p;
  },
  async op(modo, fn){
    const db = await this.abrir();
    return new Promise((res, rej) => { const tx = db.transaction("fotos", modo); const r = fn(tx.objectStore("fotos")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); });
  },
  put(k, v){ return this.op("readwrite", s => s.put(v, k)); },
  get(k){ return this.op("readonly", s => s.get(k)); },
  del(k){ return this.op("readwrite", s => s.delete(k)); }
};
const cacheFotos = {};
const usaConta = key => (key.startsWith("a_") || key.startsWith("o_")) && store.mode === "db";
async function fotoGet(key){
  if (cacheFotos[key]) return cacheFotos[key];
  try {
    let v = null;
    if (usaConta(key)) { const d = await store.fotos.doc(key).get(); v = d.exists ? d.data().full : null; }
    else v = await IDB.get(key);
    if (v) cacheFotos[key] = v;
    return v || null;
  } catch { return null; }
}
function fotoApagar(key){
  delete cacheFotos[key];
  try { if (usaConta(key)) enfileirar("f_" + key, () => store.fotos.doc(key).delete()); else IDB.del(key).catch(() => {}); } catch {}
}
function carregarImg(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error("img")); };
    im.src = u;
  });
}
function desenharImg(im, max, q, quadrado){
  let w = im.naturalWidth, h = im.naturalHeight, sx = 0, sy = 0, sw = w, sh = h;
  if (quadrado) { const m = Math.min(w, h); sx = (w - m) / 2; sy = (h - m) / 2; sw = sh = m; w = h = max; }
  else { const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
  return c.toDataURL("image/jpeg", q);
}
async function processarFoto(file){
  const im = await carregarImg(file);
  let full = null;
  // cabe num documento da conta (< 256 KB) sem perder muita qualidade
  outer: for (const max of [1280, 1080, 900, 720]) for (const q of [0.8, 0.7, 0.6]) {
    full = desenharImg(im, max, q, false);
    if (full.length < 230000) break outer;
  }
  return {full, thumb: desenharImg(im, 200, 0.65, true)};
}
async function receberFoto(key, file){
  S.fotoSalvando = true; manterScroll();
  let r;
  try { r = await processarFoto(file); }
  catch { S.fotoSalvando = false; manterScroll(); toast("Não consegui ler essa foto. Tente de novo."); return; }
  try {
    if (usaConta(key)) await tentar(() => store.fotos.doc(key).set({full: r.full, t: Date.now()}));
    else await IDB.put(key, r.full);
    cacheFotos[key] = r.full;
  } catch { toast("Não consegui guardar a foto em tamanho grande; ficou a miniatura."); }
  const id = key.slice(2);
  if (key.startsWith("a_")) { const s = S.sessoes.find(x => x.id === id); if (s) { s.foto = r.thumb; salvarSessao(s); } }
  else if (key.startsWith("o_")) { const o = S.outras.find(x => x.id === id); if (o) { o.foto = r.thumb; salvarOutra(o); } }
  else { const h = LS.get("rn_hist", []), x = h.find(y => y.id === id); if (x) { x.foto = r.thumb; if (!LS.set("rn_hist", h)) toast("Memória do aparelho cheia: a miniatura não foi salva."); } }
  S.fotoSalvando = false;
  const dk = diaDaChave(key);
  S.fotoPendente = null; S.diaSel = dk || S.diaSel;
  irPara("dia");
  toast("Foto salva no calendário");
}

const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);
const pad2 = n => String(n).padStart(2, "0");
const diaKey = ts => { const d = new Date(ts); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };
function atividades(){
  const out = S.sessoes.map(s => ({key: "a_" + s.id, tipo: "a", ts: s.inicio, dk: diaKey(s.inicio), foto: s.foto || null, titulo: s.fichaNome, obj: s}));
  S.outras.forEach(o => out.push({key: "o_" + o.id, tipo: "o", ts: o.inicio, dk: diaKey(o.inicio), foto: o.foto || null, titulo: o.nome, obj: o}));
  LS.get("rn_hist", []).forEach(r => out.push({key: "c_" + r.id, tipo: "c", ts: r.inicio, dk: diaKey(r.inicio), foto: r.foto || null, titulo: "Corrida de " + fmtKm(r.distancia) + " km", obj: r}));
  return out.sort((a, b) => b.ts - a.ts);
}
function atividadesPorDia(){
  const m = new Map();
  atividades().forEach(a => { if (!m.has(a.dk)) m.set(a.dk, []); m.get(a.dk).push(a); });
  m.forEach(l => l.sort((a, b) => a.ts - b.ts));
  return m;
}
function diaDaChave(key){ const a = atividades().find(x => x.key === key); return a ? a.dk : diaKey(Date.now()); }

    <div class="cal-legenda"><span><i></i>Academia</span><span><i class="run"></i>Corrida</span><span><i class="outra"></i>Outras</span><span>+ sem foto</span></div>

      <div><span class="num">${nA}</span><span class="rotulo">treinos de academia</span></div>
      <div><span class="num">${nC}</span><span class="rotulo">corridas · ${fmtKm(km)} km</span></div>
      <div><span class="num">${nO}</span><span class="rotulo">outras atividades</span></div>

/* =====================================================================
   Cronômetro de descanso (academia) + relógios
   ===================================================================== */
const T = {fim: 0, total: 0, tocou: false, ctx: null};
function desbloquearAudio(){
  try {
    if (!T.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) T.ctx = new AC(); }
    if (T.ctx && T.ctx.state === "suspended") T.ctx.resume();
  } catch {}
}
function bip(){
  try {
    if (!T.ctx) return;
    const t0 = T.ctx.currentTime;
    [0, 0.25, 0.5].forEach((d, k) => {
      const o = T.ctx.createOscillator(), g = T.ctx.createGain();
      o.frequency.value = k === 2 ? 1175 : 880; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.35, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
      o.connect(g); g.connect(T.ctx.destination); o.start(t0 + d); o.stop(t0 + d + 0.2);
    });
  } catch {}
}
function iniciarDescanso(seg){ T.total = seg; T.fim = Date.now() + seg * 1000; T.tocou = false; $("#descanso").classList.remove("fim"); $("#descanso").hidden = false; atualizarDescanso(); }
function pararDescanso(){ T.fim = 0; T.tocou = false; $("#descanso").hidden = true; $("#descanso").classList.remove("fim"); }
function atualizarDescanso(){
  if (!T.fim) return;
  const rest = Math.ceil((T.fim - Date.now()) / 1000);
  if (rest > 0) {
    $("#d-tempo").textContent = mmss(rest); $("#d-rotulo").textContent = "Descanso";
    $("#d-barra").style.transform = `scaleX(${Math.min(1, rest / T.total)})`;
  } else if (!T.tocou) {
    T.tocou = true; bip();
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
    $("#descanso").classList.add("fim");
    $("#d-tempo").textContent = "0:00"; $("#d-rotulo").textContent = "Hora da próxima série";
    $("#d-barra").style.transform = "scaleX(0)";
    setTimeout(() => { if (T.tocou) pararDescanso(); }, 5000);
  }
}
let tick = 0;
setInterval(() => {
  const d = $("#decorrido"); if (d && S.ativo) d.textContent = decorrido(S.ativo.inicio);
  atualizarDescanso();

    const hojeK = diaKey(Date.now());
    const dataK = /^\d{4}-\d{2}-\d{2}$/.test(n.data) && n.data <= hojeK ? n.data : hojeK;
    const fim = dataK === hojeK ? Date.now() : new Date(dataK + "T12:00:00").getTime() + min * 60000;
    const o = {id: novoId(), nome: nome.charAt(0).toUpperCase() + nome.slice(1), inicio: fim - min * 60000, fim, duracao: min};
    if (diaKey(o.inicio) !== dataK) { o.inicio = new Date(dataK + "T00:01:00").getTime(); o.fim = o.inicio + min * 60000; }
    S.outras = [o, ...S.outras];
    salvarOutra(o);
    S.novaOutra = null;
    S.fotoPendente = {key: "o_" + o.id, tipo: "o", titulo: o.nome, detalhe: fmtDur(min) + " · " + dataLonga(o.inicio)};
    irPara("foto");
  },
  "outra-apagar": b => {
    const id = b.dataset.id;
    dialogo("Excluir esta atividade?", "Ela sai do calendário e do histórico, junto com a foto.", [{t: "Manter"}, {t: "Excluir", perigo: true, fn(){
      S.outras = S.outras.filter(o => o.id !== id); apagarOutra(id); fotoApagar("o_" + id); manterScroll(); }}]);
  },
  "ver-dia": b => { S.diaSel = b.dataset.dia; irPara("dia"); },
  "cal-mes": b => { const d = new Date(S.calMes[0], S.calMes[1] + +b.dataset.d, 1); S.calMes = [d.getFullYear(), d.getMonth()]; render(); },
  "foto-depois": () => { const dk = diaDaChave(S.fotoPendente.key); S.fotoPendente = null; S.diaSel = dk; irPara("dia"); toast("Treino salvo. Adicione a foto quando puder."); },
  "run-mapa": b => { S.tela = "historico"; S.subHist = "corrida"; S.runVendo = b.dataset.id; render(); window.scrollTo(0, 0); },
  "run-apagar": b => dialogo("Excluir esta corrida?", "Ela sai do histórico. Isso não pode ser desfeito.", [{t: "Manter"}, {t: "Excluir", perigo: true, fn(){
    LS.set("rn_hist", LS.get("rn_hist", []).filter(r => r.id !== b.dataset.id)); fotoApagar("c_" + b.dataset.id); S.runVendo = null; render(); }}])
};
function salvarTreino(){
  const a = S.ativo;
  const s = {id: a.id, fichaId: a.fichaId, fichaNome: a.fichaNome, inicio: a.inicio, fim: Date.now(),
    exercicios: a.exercicios.map(e => ({nome: e.nome, series: e.series.filter(x => x.feito).map(x => ({peso: num(x.peso), reps: Math.round(num(x.reps))}))})).filter(e => e.series.length)};
  S.sessoes = [s, ...S.sessoes.filter(x => x.id !== s.id)];
  salvarSessao(s);
  S.ativo = null; salvarAtivo(); pararDescanso();
  S.fotoPendente = {key: "a_" + s.id, tipo: "a", titulo: s.fichaNome, detalhe: `${nSeries(s)} séries · ${fmtKg(volume(s))} kg de volume · ${Math.max(1, Math.round((s.fim - s.inicio) / 60000))} min`};
  irPara("foto");
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-dlg]");
  if (d) { const b = dlgBtns[+d.dataset.dlg]; $("#dlg").hidden = true; if (b && b.fn) b.fn(); return; }
  if (e.target.id === "dlg") { $("#dlg").hidden = true; return; }
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const fn = ACOES[b.dataset.act]; if (fn) fn(b, e);
});
$("#btn-centralizar").addEventListener("click", () => {
  if (S.runVendo) { const r = LS.get("rn_hist", []).find(x => x.id === S.runVendo); if (r) desenharTrajeto(r, true); return; }
  R.seguir = true; $("#btn-centralizar").hidden = true;
  if (R.ultimaPos && mapa) mapa.setView([R.ultimaPos.lat, R.ultimaPos.lon], 17);
});
function aoDigitar(e){
  const t = e.target;
  if (t.dataset.change === "evo") { S.evoEx = t.value; manterScroll(); return; }
  if (S.tela === "sessao" && t.dataset.campo) {
    const row = t.closest(".serie"); if (!row || !S.ativo) return;
    S.ativo.exercicios[+row.dataset.i].series[+row.dataset.j][t.dataset.campo] = t.value; salvarAtivo(); return;
  }
  if (S.tela === "outra" && S.novaOutra && t.dataset.no) {
    S.novaOutra[t.dataset.no] = t.dataset.no === "nome" ? t.value : (t.dataset.no === "data" ? t.value : t.value.replace(/\D/g, "").slice(0, 3));
    if (t.dataset.no !== "data" && t.value !== S.novaOutra[t.dataset.no]) t.value = S.novaOutra[t.dataset.no];
    if (t.dataset.no === "nome") document.querySelectorAll('[data-act="outra-nome"]').forEach(x => x.setAttribute("aria-pressed", norm(x.dataset.v) === norm(t.value)));
    else if (t.dataset.no !== "data") { const tot = (+S.novaOutra.h || 0) * 60 + (+S.novaOutra.m || 0); document.querySelectorAll('[data-act="outra-tempo"]').forEach(x => x.setAttribute("aria-pressed", tot === +x.dataset.h * 60 + +x.dataset.m)); }
    return;
  }
  if (S.tela === "perfil") {
    if (t.id === "imp-texto") S.importTexto = t.value;
    else if (t.dataset.pf && e.type === "change") {
      S.perfil[t.dataset.pf] = t.dataset.pf === "descansoPadrao" ? +t.value : t.value.trim().slice(0, 40);
      salvarPerfil();
    }
    return;
  }
  if (S.tela === "editor" && S.editor) {
    if (t.dataset.ed) S.editor[t.dataset.ed] = t.value;
    else if (t.dataset.edx !== undefined) S.editor.exercicios[+t.dataset.edx][t.dataset.campo] = t.value;
  }
}
document.addEventListener("input", e => { if (e.target.tagName !== "SELECT") aoDigitar(e); });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.foto) {
    const f = t.files && t.files[0], key = t.dataset.foto; t.value = "";
    if (f) receberFoto(key, f);
    return;
  }
  if (t.id === "imp-arquivo") {
    const f = t.files && t.files[0]; t.value = "";
    if (!f) return;
    if (f.size > 300000) { toast("Arquivo grande demais. Envie só o texto das fichas."); return; }
    try { S.importTexto = await f.text(); } catch { toast("Não consegui ler esse arquivo. Tente um .txt."); return; }
    const ta = $("#imp-texto"); if (ta) ta.value = S.importTexto;
    lerImportacao();
    return;
  }
  if (t.tagName === "SELECT" || t.dataset.pf || t.dataset.no === "data") aoDigitar(e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#dlg").hidden) $("#dlg").hidden = true; });
window.addEventListener("pagehide", () => { if (R.c) salvarCorridaAtiva(true); });

/* =====================================================================
   Início
   ===================================================================== */
(function restaurarCorrida(){
  const salva = LS.get("rn_ativa", null);
  if (!salva || !salva.corrida) return;
  R.c = salva.corrida;
  if (R.c.retomadoEm) {
    const ult = R.c.segmentos.flat().slice(-1)[0];
    R.c.acumulado += Math.max(0, (ult ? ult.t : Date.now()) - R.c.retomadoEm);
    R.c.retomadoEm = null;
  }
  R.status = "pausado";
  S.aviso = "Uma corrida foi interrompida quando a página recarregou. Ela está pausada no último ponto registrado; abra Corrida e toque em Continuar.";
})();
carregarDados();
</script>
